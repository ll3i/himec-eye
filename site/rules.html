    </div>
  </div>
</div>

const KO = {person:'작업자',helmet:'안전모 착용',no_helmet:'안전모 미착용',vest:'안전조끼 착용',no_vest:'안전조끼 미착용',goggles:'보안경 착용',no_goggles:'보안경 미착용',gloves:'안전장갑 착용',no_gloves:'안전장갑 미착용',cone:'안전콘',smoke:'연기',corrosion:'부식',crack:'균열',cable_damage:'케이블 손상',weld_bad:'용접 불량',weld_good:'용접 양호',weld_defect:'용접 결함부',wall_damage:'벽체 손상',ok:'양품',incorrect_install:'조립 불량',dry_joint:'냉납',board_damage:'기판 손상',short_circuit:'단락',surface_defect:'표면 결함',cell_anomaly:'셀 이상',cell_ok:'정렬 정상 셀',cell_reversed:'역극 셀',forklift:'지게차',worker:'작업자',chassis_loaded:'적재 섀시',chassis_empty:'공차 섀시',chassis_working:'상하차 진행',stacker:'스태커',car:'승용차',truck:'트럭',bus:'버스'};
const THRESH = {no_helmet:.25,no_vest:.30,no_goggles:.30,no_gloves:.30,smoke:.55,corrosion:.35,crack:.30,cable_damage:.35,weld_bad:.35,weld_defect:.35,wall_damage:.35,dry_joint:.35,incorrect_install:.30,board_damage:.35,short_circuit:.30,surface_defect:.35,cell_anomaly:.35,cell_ok:.40,cell_reversed:.25,forklift:.35,worker:.30,chassis_working:.45,car:.35,bus:.35,truck:.35};
const TH = (c) => THRESH[c] !== undefined ? THRESH[c] : 0.25;
const RULE_OF = {};
D.forEach(d => d.rules.forEach(r => { RULE_OF[r.id] = {title:r.title, risk:r.risk}; }));
const CLS2RULE = {no_helmet:'S-01',no_vest:'S-02',no_goggles:'S-03',no_gloves:'S-04',smoke:'S-05',
  corrosion:'D-01',crack:'D-02',cable_damage:'D-03',weld_bad:'D-04',weld_defect:'D-05',wall_damage:'D-06',
  dry_joint:'P-01',incorrect_install:'P-02',board_damage:'P-03',short_circuit:'P-04',surface_defect:'P-05',cell_anomaly:'P-06',
  cell_reversed:'X-01',chassis_working:'L-02'};
const ov = (inner, outer) => {
  const x1 = Math.max(inner[0], outer[0]), y1 = Math.max(inner[1], outer[1]);
  const x2 = Math.min(inner[2], outer[2]), y2 = Math.min(inner[3], outer[3]);
  if (x2 <= x1 || y2 <= y1) return 0;
  const a = (inner[2]-inner[0]) * (inner[3]-inner[1]);
  return a <= 0 ? 0 : ((x2-x1)*(y2-y1)) / a;
};
// 관계 추론 — rules.py derive_ppe_findings 와 동일 조건
const derivePPE = (dets) => {
  const persons = dets.filter(x => x.c === 'person' && x.p >= 0.35 &&
    (x.b[2]-x.b[0]) * (x.b[3]-x.b[1]) >= 0.04);
  if (!persons.length) return [];
  const worn = {helmet: dets.filter(x=>x.c==='helmet').map(x=>x.b),
                vest: dets.filter(x=>x.c==='vest').map(x=>x.b)};
  const direct = new Set(dets.filter(x => x.p >= TH(x.c)).map(x => x.c));
  const zones = [['helmet','no_helmet',0,0.35],['vest','no_vest',0.20,0.75]];
  const out = [];
  zones.forEach(([okc, ngc, t0, t1]) => {
    if (direct.has(ngc)) return;
    let n = 0;
    persons.forEach(p => {
      const h = p.b[3]-p.b[1];
      const zone = [p.b[0], p.b[1]+h*t0, p.b[2], p.b[1]+h*t1];
      if (worn[okc].some(b => ov(b, zone) >= 0.3)) return;
      n++;
    });
    if (n) out.push({id:CLS2RULE[ngc], n, how:'관계 추론'});
  });
  return out;
};
// 관계 추론 — rules.py derive_logistics_findings 와 동일 조건
const deriveLogi = (dets) => {
  const forks = dets.filter(x => x.c === 'forklift' && x.p >= TH('forklift'));
  const workers = dets.filter(x => x.c === 'worker' && x.p >= TH('worker'));
  let n = 0;
  forks.forEach(f => {
    const w = f.b[2]-f.b[0], h = f.b[3]-f.b[1];
    const zone = [f.b[0]-w*0.35, f.b[1]-h*0.175, f.b[2]+w*0.35, f.b[3]+h*0.175];
    workers.forEach(k => { if (ov(k.b, zone) >= 0.35) n++; });
  });
  return n ? [{id:'L-01', n, how:'관계 추론'}] : [];
};

class Component extends DCLogic {
  state = {sel:{}, weak:{}, role:0};


  chip(color, bg){
    return {fontSize:'11.5px',fontWeight:700,letterSpacing:'-.02em',borderRadius:'8px',
            padding:'3px 9px',color:color,background:bg,whiteSpace:'nowrap',textAlign:'center'};
  }

  panel(d){
    const det = DET;
    const ids = Object.keys(det).filter(k => det[k].task === d.key);
    const cur = this.state.sel[d.key] || ids[0];
    const it = det[cur];
    const weak = !!this.state.weak[d.key];

    const boxes = it.det.filter(x => weak ? x.p >= 0.05 : x.p >= TH(x.c)).slice(0,20).map((x,i) => {
      const adopted = x.p >= TH(x.c);
      const isBad = !!CLS2RULE[x.c];
      const col = !adopted ? '#b0b8c1' : (isBad ? (RULE_OF[CLS2RULE[x.c]] && RULE_OF[CLS2RULE[x.c]].risk === 4 ? '#f04452' : '#ff8a00') : '#15b57b');
      const top = x.b[1]*100;
      return {key:i,
        label:(KO[x.c]||x.c)+'  '+Math.round(x.p*100)+'%',
        style:{position:'absolute', left:(x.b[0]*100)+'%', top:top+'%',
               width:((x.b[2]-x.b[0])*100)+'%', height:((x.b[3]-x.b[1])*100)+'%',
               border:(adopted?'2.5px':'1.5px')+' '+(adopted?'solid':'dashed')+' '+col,
               borderRadius:'4px', opacity: adopted ? 1 : .7, pointerEvents:'none'},
        tag:Object.assign({position:'absolute', top: top < 7 ? '2px' : '-18px', background:col, color:'#fff',
             font:'700 11px Pretendard,sans-serif', letterSpacing:'-.02em', padding:'0 6px',
             borderRadius:'5px', whiteSpace:'nowrap', lineHeight:'16px'},
             x.b[2] > 0.7 ? {right:'-2.5px'} : {left:'-2.5px'})};
    });

    const counts = {};
    it.det.forEach(x => { if (x.p >= TH(x.c)) counts[x.c] = (counts[x.c]||0)+1; });
    let found = Object.keys(counts).filter(c => CLS2RULE[c]).map(c => ({id:CLS2RULE[c], n:counts[c], how:'직접 검출'}));
    if (d.key === 'safety') found = found.concat(derivePPE(it.det));
    if (d.key === 'logistics') found = found.concat(deriveLogi(it.det));
    if (d.key === 'parking'){
      const n = ['car','bus','truck'].reduce((s,c) => s + (counts[c]||0), 0);
      if (n) found.push({id:'K-01', n, how:'집계'});
    }
    const findings = found.map((f,i) => {
      const r = RULE_OF[f.id] || {title:f.id, risk:1};
      return {key:i, id:f.id, title:r.title+' · '+f.n+'건', risk:RISK_KO[r.risk],
              chip:this.chip(HUE[r.risk], HUE_BG[r.risk]),
              tag:this.chip(f.how === '직접 검출' ? '#8b95a1' : '#3182f6', f.how === '직접 검출' ? '#f2f4f6' : '#e8f2fe'),
              how:f.how};
    });
    const maxRisk = found.reduce((m,f) => Math.max(m, (RULE_OF[f.id]||{risk:0}).risk||0), 0);
    const verdict = maxRisk >= 3 ? '부적합' : maxRisk === 2 ? '조건부적합' : '적합';
    const vcol = maxRisk >= 3 ? '#f04452' : maxRisk === 2 ? '#f5a623' : '#15b57b';

    const rows = it.det.slice(0,10).map((x,i) => {
      const adopted = x.p >= TH(x.c);
      return {key:i, cls:x.c, ko:KO[x.c]||x.c, p:x.p.toFixed(2), th:TH(x.c).toFixed(2),
              state: adopted ? '채택' : '미채택',
              chip:Object.assign(this.chip(adopted ? '#0f9d6b' : '#8b95a1', adopted ? '#e6f7f0' : '#f2f4f6'),
                                 {fontSize:'11px', padding:'2px 7px'})};
    });

    return {
      thumbs: ids.map(id => ({
        key:id, pick: () => this.setState(s => ({sel:Object.assign({}, s.sel, {[d.key]:id})})),
        style:{width:'56px', height:'44px', flex:'0 0 56px', padding:0, cursor:'pointer', borderRadius:'10px',
               backgroundImage:'url('+IMG[id]+')', backgroundSize:'cover', backgroundPosition:'center',
               border:'none', outline: id === cur ? '2.5px solid #3182f6' : '1px solid #e5e8eb',
               outlineOffset: id === cur ? '1px' : '-1px', opacity: id === cur ? 1 : .6}
      })),
      shotStyle:{position:'relative', width:'100%', aspectRatio:it.w+' / '+it.h, overflow:'hidden',
                 borderRadius:'14px', backgroundColor:'#e5e8eb',
                 backgroundImage:'url('+IMG[cur]+')', backgroundSize:'100% 100%'},
      boxes, rows, findings, verdict,
      summary:'검출 '+it.det.length+' · 채택 '+Object.values(counts).reduce((a,b)=>a+b,0),
      verdictStyle:{fontSize:'15px',fontWeight:800,letterSpacing:'-.03em',borderRadius:'999px',
                    padding:'5px 15px',color:'#fff',background:vcol},
      toggleWeak: () => this.setState(s => ({weak:Object.assign({}, s.weak, {[d.key]:!s.weak[d.key]})})),
      weakLabel: weak ? '미채택 표시 켜짐' : '미채택 표시',
      weakStyle:{font:'700 12.5px Pretendard,sans-serif', letterSpacing:'-.02em', padding:'7px 13px',
                 cursor:'pointer', borderRadius:'10px', border:'none', whiteSpace:'nowrap',
                 color: weak ? '#fff' : '#4e5968', background: weak ? '#3182f6' : '#e5e8eb'},
      foot:'점선 회색 = 임계값 미만 · 지적사항 제외'
    };
  }

  renderVals(){
    return {
      nav: D.map((d,i) => ({
        key:d.key, code:d.code, ko:d.ko, one:d.pipe[1] ? d.pipe[1].title : '',
        pick: () => this.setState({role:i}),
        style:{display:'block', width:'100%', textAlign:'left', font:'inherit', cursor:'pointer',
               padding:'12px 14px', borderRadius:'14px', border:'none',
               background: i === this.state.role ? '#f2f4f6' : 'transparent',
               color: i === this.state.role ? '#191f28' : '#4e5968'}
      })),
      blocks: [D[Math.min(this.state.role, D.length-1)]].map(d => Object.assign({
        key:d.key, code:d.code, ko:d.ko, weights:d.weights,
        pipe: d.pipe.map(p => ({key:p.n, n:p.n, tag:p.tag, title:p.title, body:p.body})),
        classes: d.classes.map(c => ({key:c.cls, cls:c.cls, ko:c.ko, conf:c.conf, why:c.why})),
        rules: d.rules.map(r => ({
          key:r.id, id:r.id, title:r.title, cond:r.cond, basis:r.basis, action:r.action,
          risk: RISK_KO[r.risk],
          chip:{fontSize:'11.5px',fontWeight:700,letterSpacing:'-.02em',borderRadius:'8px',
                padding:'3px 9px',color:HUE[r.risk],background:HUE_BG[r.risk],whiteSpace:'nowrap'}
        })),
        hasLogic: d.logic.length > 0,
        logicTitle: d.logicTitle,
        logic: d.logic.map((l,i) => ({key:i, t:l.t})),
        output: d.output, limit: d.limit
      }, this.panel(d)))
    };
  }
}

  DC.mount(root, Component);
})();
</script>
</body>
</html>
