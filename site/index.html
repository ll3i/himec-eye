<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
html,body{margin:0;padding:0;height:100%;background:#fff}
body{display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;word-break:keep-all;
  font-family:Pretendard,'Malgun Gothic',system-ui,sans-serif;letter-spacing:-.02em;color:#191f28}
header{flex:0 0 auto;display:flex;align-items:center;padding:0 12px;height:46px;
  border-bottom:1px solid #e5e8eb;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav{display:flex;gap:2px}
.tab{font:700 13px Pretendard,'Malgun Gothic',system-ui,sans-serif;letter-spacing:-.02em;
  padding:7px 13px;border:none;border-radius:9px;background:transparent;color:#8b95a1;
  cursor:pointer;white-space:nowrap}
.tab:hover{background:#f2f4f6;color:#4e5968}
.tab.on{background:#191f28;color:#fff}
.tab:focus-visible{outline:2px solid #3182f6;outline-offset:1px}
iframe{flex:1;width:100%;border:0;display:block;min-height:0}
</style>
</head>
<body>
<header>
  <nav aria-label="화면 선택">
  <button type="button" data-p="watch" class="tab on">관제 화면</button>
  <button type="button" data-p="linesim" class="tab">현장 재현 영상</button>
  <button type="button" data-p="main" class="tab">판독 결과</button>
  <button type="button" data-p="rules" class="tab">판정 작동</button>
  <button type="button" data-p="report" class="tab">분석 리포트</button>
  </nav>
</header>
<iframe id="view" src="watch.html" title="HIMEC EYE 화면"></iframe>
<script>
(function () {
  var view = document.getElementById("view");
  var tabs = [].slice.call(document.querySelectorAll(".tab"));
  var known = tabs.map(function (t) { return t.dataset.p; });
  function show(p) {
    tabs.forEach(function (t) {
      var on = t.dataset.p === p;
      t.classList.toggle("on", on);
      t.setAttribute("aria-current", on ? "page" : "false");
    });
    if (view.getAttribute("src") !== p + ".html") view.setAttribute("src", p + ".html");
  }
  tabs.forEach(function (t) {
    t.addEventListener("click", function () {
      if (location.hash.slice(1) === t.dataset.p) return;
      history.pushState(null, "", "#" + t.dataset.p);   // 뒤로가기로 이전 화면에 돌아갈 수 있게
      show(t.dataset.p);
    });
  });
  window.addEventListener("hashchange", function () {
    var h = location.hash.slice(1);
    show(known.indexOf(h) >= 0 ? h : "watch");
  });
  var h = location.hash.slice(1);
  if (known.indexOf(h) >= 0) show(h);
})();
</script>
</body>
</html>
